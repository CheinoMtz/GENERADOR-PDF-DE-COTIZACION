<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotizador · Muebles Martínez</title>
<style>
:root{--ink:#222a33;--navy:#2b3440;--wood:#b9885c;--wood2:#8a6038;--line:#ddd6cc;--bg:#ece7df;--err:#b3261e;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px}
.bar b{font:700 16px Georgia,serif;letter-spacing:.14em;margin-right:auto}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:40px}
button.p{background:var(--wood);border-color:var(--wood);color:#fff;font-weight:600}
:is(button,input,select,textarea):focus-visible{outline:3px solid #e0a867;outline-offset:1px}
.app{display:grid;gap:16px;max-width:1280px;margin:0 auto;padding:12px}
@media(min-width:960px){.app{grid-template-columns:minmax(340px,430px) 1fr;align-items:start}}
.ui section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.ui h2{font:600 15px Georgia,serif;margin:0 0 6px;color:var(--wood2)}
label{display:block;font-size:13px;margin:8px 0 0}
input,select,textarea{display:block;width:100%;font:inherit;padding:8px;border:1px solid #b9b2a7;border-radius:6px;background:#fff;color:var(--ink);margin-top:2px}
textarea{min-height:80px;resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bad{border-color:var(--err)!important;background:#fff4f2!important}
#errs{background:#fff4f2;border:1px solid var(--err);border-radius:8px;padding:8px 12px;margin-bottom:12px;color:var(--err)}
#errs ul{margin:4px 0 0;padding-left:18px}#errs li{cursor:pointer;text-decoration:underline}
.mb{border-top:1px solid var(--line);margin-top:10px;padding-top:2px}.mb:first-child{border:0;margin:0}.mdel{margin-top:8px}
.hint{font-size:12px;color:#666;margin:4px 0 0}
.hi{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.hi span{flex:1;min-width:140px;font-size:13px}.hi button{padding:4px 8px;min-height:32px;font-size:13px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:9;max-width:90%}
dialog{border:1px solid var(--line);border-radius:10px;max-width:480px;width:92%;padding:16px;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dl{margin:8px 0}dt{font-size:12px;color:#666}dd{margin:0 0 6px;font-weight:600}
.warn{background:#fff4d6;border:1px solid #d9a400;border-radius:6px;padding:6px 10px;margin:6px 0}
.doc{background:#fff;border:1px solid var(--line);max-width:800px;width:100%;margin:0 auto;font-size:14px;overflow:hidden}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:16px 20px;border-bottom:3px solid var(--wood)}
.wm{font:700 24px Georgia,serif;letter-spacing:.2em}
.wm small{display:block;font:11px system-ui;letter-spacing:.16em;color:var(--wood2);margin-top:3px}
.meta{text-align:right;font-size:12px}
.ti{background:var(--navy);color:#fff;padding:10px 20px;font:600 19px Georgia,serif}
.bl{padding:12px 20px;border-bottom:1px solid var(--line);break-inside:avoid;overflow-wrap:anywhere}
.bl h3{font:600 14px Georgia,serif;color:var(--wood2);margin:0 0 6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.imgs{display:flex;justify-content:center;align-items:flex-start}
.img-box{--mh:260px;max-width:100%;text-align:center}
.img-box img{display:block;max-width:100%;max-height:var(--mh);width:auto;height:auto;margin:0 auto;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#faf8f5}
.img-box.sz-m{--mh:390px}
.img-box.sz-l{--mh:520px}
.img-box.sz-x{--mh:700px}
.doc ul{margin:0;padding:0;list-style:none}.doc li{padding:1px 0 1px 18px;position:relative}
.doc li::before{content:"✓";position:absolute;left:0;color:var(--wood2)}
.row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted var(--line)}
.tot{background:var(--navy);color:#fff;text-align:center;padding:16px;break-inside:avoid}
.tot b{display:block;font:700 38px Georgia,serif}.tot small{opacity:.85}
.sg{display:flex;gap:24px;padding:36px 20px 16px;break-inside:avoid}
.sg div{flex:1;border-top:1px solid var(--ink);text-align:center;font-size:12px;padding-top:4px}
.mu{color:#777;font-size:12px}
#cropDlg{max-width:min(720px,92vw);width:auto}
#cropWrap{position:relative;display:inline-block;max-width:100%;touch-action:none;user-select:none;margin:8px 0}
#cropImg{display:block;max-width:100%;max-height:60vh;cursor:crosshair;-webkit-user-drag:none;user-select:none;border:1px solid var(--line);border-radius:4px;background:#faf8f5}
#cropSel{position:absolute;border:2px dashed #b9885c;background:rgba(185,136,92,.2);display:none;pointer-events:none;box-sizing:border-box;border-radius:2px}
@media print{.doc .img-box{--mh:170px}.doc .img-box.sz-m{--mh:255px}.doc .img-box.sz-l{--mh:340px}.doc .img-box.sz-x{--mh:450px}.bl{padding:8px 20px}.sg{padding-top:24px}body{background:#fff}.ui,.bar,#toast{display:none!important}.app{display:block;padding:0}.doc{border:0;max-width:none}@page{size:A4;margin:10mm}}
</style></head><body>
<div class="bar ui"><b>MUEBLES MARTÍNEZ</b>
<button id="bSave">Guardar</button><button id="bCopy">Copiar texto</button><button id="bPdf" class="p">Exportar PDF</button><button id="bNew">Nueva</button></div>
<div class="app">
<div class="ui" id="side">
<div id="errs" hidden></div>
<section><h2>Cliente</h2>
<label>Nombre *<input id="cli" maxlength="80" autocomplete="off"></label>
<div class="r2"><label>Teléfono<input id="tel" inputmode="tel" maxlength="20"></label><label>Fecha<input id="fecha" type="date"></label></div>
<label>Dirección<input id="dir" maxlength="120"></label></section>
<section><h2>Muebles</h2>
<label style="display:flex;gap:8px;align-items:center"><input id="multi" type="checkbox" style="width:auto;margin:0">Cotizar varios muebles</label>
<div id="mlist"></div><button id="bAdd" hidden style="margin-top:8px">+ Agregar otro mueble</button>
<label>Render o foto<input id="img" type="file" accept="image/*"></label>
<div id="imgTools" hidden>
  <div class="r2" style="margin-top:8px">
    <label style="margin:0">Tamaño<select id="imgSize">
      <option value="s">Pequeña</option>
      <option value="m">Mediana</option>
      <option value="l">Grande (2×)</option>
      <option value="x">Muy grande</option>
    </select></label>
    <button id="bCropImg" type="button" style="align-self:end">✂️ Recortar</button>
  </div>
  <button id="bImg" style="margin-top:8px">Quitar render</button>
</div>
<label>Despiece del mueble<input id="imgDespiece" type="file" accept="image/*"></label>
<div id="despieceTools" hidden>
  <div class="r2" style="margin-top:8px">
    <label style="margin:0">Tamaño<select id="despieceSize">
      <option value="s">Pequeña</option>
      <option value="m">Mediana</option>
      <option value="l">Grande (2×)</option>
      <option value="x">Muy grande</option>
    </select></label>
    <button id="bCropDespiece" type="button" style="align-self:end">✂️ Recortar</button>
  </div>
  <button id="bImgDespiece" style="margin-top:8px">Quitar despiece</button>
</div>
</section>
<section><h2>Contenido</h2><p class="hint">Un elemento por línea.</p>
<label>Herrajes incluidos<textarea id="herr"></textarea></label>
<label>Notas<textarea id="nota"></textarea></label></section>
<section><h2>Inversión y tiempos</h2>
<div class="r2"><label>Inversión total (MXN) *<input id="total" type="number" inputmode="numeric" min="1" step="1"></label>
<label>IVA<select id="iva"><option value="inc">IVA incluido</option><option value="mas">Más IVA</option></select></label></div>
<div class="r2"><label>Días hábiles *<input id="dias" type="number" inputmode="numeric" min="1" step="1"></label><label>Vigencia (días)<input id="vig" type="number" inputmode="numeric" min="1" step="1"></label></div>
<div class="r2"><label>Anticipo (%)<input id="ant" type="number" inputmode="numeric" min="0" max="100" step="1"></label><label>Garantía (meses)<input id="gar" type="number" inputmode="numeric" min="1" step="1"></label></div></section>
<section><h2>Historial</h2><div id="hist"></div></section>
</div>
<div id="doc" class="doc"></div>
</div>
<dialog id="dlg"><h2 style="font:600 17px Georgia,serif;margin:0">Revisa antes de exportar</h2><div id="dsum"></div>
<div class="r2"><button id="dno">Corregir</button><button id="dok" class="p">Confirmar y exportar</button></div></dialog>
<dialog id="cropDlg">
  <h2 style="font:600 17px Georgia,serif;margin:0 0 4px">Recortar imagen</h2>
  <p class="hint" style="margin:0 0 4px">Arrastra sobre la imagen para marcar el área que quieres conservar.</p>
  <div id="cropWrap">
    <img id="cropImg" alt="Imagen a recortar" draggable="false">
    <div id="cropSel"></div>
  </div>
  <div class="r2" style="margin-top:8px">
    <button id="cropCancel" type="button">Cancelar</button>
    <button id="cropApply" class="p" type="button">Aplicar recorte</button>
  </div>
</dialog>
<div id="toast" role="status" hidden></div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=['cli','tel','dir','fecha','vig','herr','nota','total','iva','dias','ant','gar'];
const K='mm_cot_v1',DR='mm_draft_v1',MT=['Cocina integral','Closet','Baño','Buró','Mesa','Mueble a medida'],MAX=10;
const SIZES=['s','m','l','x'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const D=()=>({cli:'',tel:'',dir:'',fecha:today(),vig:'15',
herr:'Bisagras Torinese cierre suave\nCorrederas Handy Home 50 cm\nPerfil gola\nPatitas niveladoras\nCanto de PVC',
nota:'Incluye diseño, fabricación e instalación.\nNo incluye cubierta de granito.\nEl importe puede variar según selecciones definitivas.',total:'',iva:'inc',dias:'',ant:'50',gar:'',multi:false,
muebles:[{t:'Cocina integral',m:'',x:'MDF color madera (inferiores)\nMDF blanco alto brillo (superiores)\nCubierta tradicional\nInterior blanco\nCanteado con PVC',d:''}]});
const ls={get(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const num=v=>{v=String(v==null?'':v).trim().replace(',','.');return v===''?NaN:Number(v)};
const list=s=>String(s).split('\n').map(x=>x.trim()).filter(Boolean).slice(0,30);
const mx=n=>'$'+Math.round(n).toLocaleString('en-US');
const vdate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const[y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d&&y>=2000&&y<=2100};
const fdate=(s,add)=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d+(add||0)).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})};
let cur={id:null,folio:null,img:'',despiece:'',imgSize:'l',despieceSize:'l'},shown=false,tt;
const isImg=v=>typeof v==='string'&&/^data:image\/(jpeg|png);/.test(v);
const normSize=v=>SIZES.includes(v)?v:'l';
const gm=()=>[...document.querySelectorAll('.mb')].map(b=>({t:b.querySelector('.mt').value,m:b.querySelector('.mm').value,x:b.querySelector('.mx').value,d:b.querySelector('.md').value}));
const get=()=>{const o={};F.forEach(i=>o[i]=$(i).value);o.multi=$('multi').checked;o.muebles=gm();return o};
const sm=a=>a.slice(0,MAX).map(x=>({t:MT.includes(x&&x.t)?x.t:MT[0],m:String(x&&x.m||''),x:String(x&&x.x||''),d:String(x&&x.d||'')}));
function mig(o){o=o&&typeof o==='object'?o:{};if(Array.isArray(o.muebles)&&o.muebles.length)return o;
const m=[1,2,3].map(i=>o['s'+i+'v']?((o['s'+i+'n']||'Lado '+i)+' '+o['s'+i+'v']+' cm'):'').filter(Boolean).join(' × ');
return Object.assign({},o,{muebles:[{t:o.tipo,m:m,x:o.mats,d:o.det}],multi:false})}
function rows(ms){const mu=$('multi').checked;$('mlist').innerHTML=ms.map((m,i)=>'<div class="mb"><div class="r2"><label>'+(mu?'Mueble '+(i+1):'Tipo')+'<select id="m'+i+'t" class="mt">'+MT.map(t=>'<option'+(t===m.t?' selected':'')+'>'+t+'</option>').join('')+'</select></label><label>Medidas *<input id="m'+i+'m" class="mm" maxlength="100" placeholder="Ej. 306 × 308 cm" value="'+esc(m.m)+'"></label></div><label>Materiales *<textarea id="m'+i+'x" class="mx">'+esc(m.x)+'</textarea></label><label>Detalles<textarea id="m'+i+'d" class="md" placeholder="Ej. Tarja a la izquierda">'+esc(m.d)+'</textarea></label>'+(mu&&ms.length>1?'<button class="mdel" data-i="'+i+'">Quitar mueble '+(i+1)+'</button>':'')+'</div>').join('');$('bAdd').hidden=!mu||ms.length>=MAX}
function setForm(o){o=mig(o);const b=D();F.forEach(i=>{const e=$(i);e.value=o[i]!=null?String(o[i]):b[i];if(e.tagName==='SELECT'&&!e.value)e.value=b[i]});const ms=sm(o.muebles);$('multi').checked=ms.length>1||o.multi===true;rows(ms)}
function setCur(r){cur={
  id:(r&&r.id)||null,
  folio:(r&&r.folio)||null,
  img:(r&&isImg(r.img))?r.img:'',
  despiece:(r&&isImg(r.despiece))?r.despiece:'',
  imgSize:normSize(r&&r.imgSize),
  despieceSize:normSize(r&&r.despieceSize)
}}
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3500)}
function validate(d){const e=[],p=(i,m)=>e.push([i,m]);
if(d.cli.trim().length<2)p('cli','Escribe el nombre del cliente.');
if(d.tel.trim()&&d.tel.replace(/\D/g,'').length!==10)p('tel','El teléfono debe tener 10 dígitos.');
if(!vdate(d.fecha))p('fecha','La fecha no es válida.');
const v=num(d.vig);if(!Number.isInteger(v)||v<1||v>90)p('vig','Vigencia: de 1 a 90 días.');
d.muebles.forEach((m,i)=>{const q=d.muebles.length>1?'Mueble '+(i+1)+': ':'';if(!/\d/.test(m.m))p('m'+i+'m',q+'escribe las medidas, con números.');if(!list(m.x).length)p('m'+i+'x',q+'agrega al menos un material.')});
const t=num(d.total);if(!Number.isInteger(t)||t<1||t>99999999)p('total','Inversión total: pesos enteros, sin comas ni centavos.');
const n=num(d.dias);if(!Number.isInteger(n)||n<1||n>365)p('dias','Días hábiles: de 1 a 365.');
const a=num(d.ant);if(!Number.isInteger(a)||a<0||a>100)p('ant','Anticipo: de 0 a 100 %.');
if(d.gar.trim()){const g=num(d.gar);if(!Number.isInteger(g)||g<1||g>60)p('gar','Garantía: de 1 a 60 meses, o déjala vacía.')}
return e}
function pay(d){const t=num(d.total),p=num(d.ant);if(!Number.isInteger(t)||!(p>=0&&p<=100))return'';
const a=Math.round(t*p/100),r=t-a;
if(p===100)return'Pago único de '+mx(t)+' al autorizar.';if(p===0)return'Pago de '+mx(t)+' contra entrega e instalación.';
return'Anticipo '+p+'%: '+mx(a)+' al autorizar. Saldo: '+mx(r)+' contra entrega e instalación.'}
const li=s=>list(s).map(x=>'<li>'+esc(x)+'</li>').join('');
const imgBlock=(src,alt,title,size)=>'<div class="bl"><h3>'+title+'</h3><div class="imgs"><div class="img-box sz-'+normSize(size)+'"><img src="'+esc(src)+'" alt="'+esc(alt)+'"></div></div></div>';
function doc(d){const t=num(d.total),okT=Number.isInteger(t)&&t>0,ok=vdate(d.fecha),v=num(d.vig),dd=num(d.dias),g=num(d.gar),N=d.muebles.length;
const mb=d.muebles.map((m,i)=>'<div class="bl"><h3>'+(N>1?(i+1)+'. ':'')+esc(m.t)+'</h3><div class="row"><span>Medidas</span><b>'+esc(m.m.trim()||'—')+'</b></div>'+(list(m.x).length?'<div class="mu" style="margin-top:6px">Materiales</div><ul>'+li(m.x)+'</ul>':'')+(list(m.d).length?'<div class="mu" style="margin-top:6px">Detalles</div><ul>'+li(m.d)+'</ul>':'')+'</div>').join('');
return'<div class="dh"><div class="wm">MUEBLES MARTÍNEZ<small>CALIDAD · DISEÑO · PERSONALIZACIÓN</small></div><div class="meta"><b>Folio: '+esc(cur.folio||'se asigna al guardar')+'</b><br>Fecha: '+(ok?fdate(d.fecha):'—')+'<br>Vigencia: '+(ok&&Number.isInteger(v)&&v>0?'hasta el '+fdate(d.fecha,v):'—')+'</div></div>'
+'<div class="ti">Cotización – '+esc([...new Set(d.muebles.map(m=>m.t))].join(', '))+'</div>'
+'<div class="bl"><h3>Cliente</h3><div>'+esc(d.cli.trim()||'—')+'</div>'+(d.tel.trim()?'<div>Tel. '+esc(d.tel.trim())+'</div>':'')+(d.dir.trim()?'<div>'+esc(d.dir.trim())+'</div>':'')+'</div>'
+(cur.img?imgBlock(cur.img,'Render del proyecto','Render',cur.imgSize):'')
+mb
+(list(d.herr).length?'<div class="bl"><h3>Herrajes incluidos</h3><ul>'+li(d.herr)+'</ul></div>':'')
+'<div class="bl"><h3>Tiempo estimado</h3>'+(Number.isInteger(dd)&&dd>0?dd+' días hábiles de fabricación e instalación':'—')+'</div>'
+'<div class="tot"><small>Inversión total</small><b>'+(okT?mx(t)+' MXN':'$ —')+'</b><small>'+(d.iva==='mas'?'Más IVA':'IVA incluido')+'</small></div>'
+'<div class="bl"><h3>Forma de pago</h3>'+esc(pay(d)||'—')+(d.gar.trim()&&Number.isInteger(g)&&g>0?'<br>Garantía: '+g+(g===1?' mes.':' meses.'):'')+'</div>'
+(list(d.nota).length?'<div class="bl"><h3>Notas</h3><ul>'+li(d.nota)+'</ul></div>':'')
+(cur.despiece?imgBlock(cur.despiece,'Despiece del mueble','Despiece',cur.despieceSize):'')
+'<div class="sg"><div>Muebles Martínez</div><div>Cliente · Acepto la cotización</div></div>'}
function render(){const d=get();
$('doc').innerHTML=doc(d);
$('imgTools').hidden=!cur.img;
$('despieceTools').hidden=!cur.despiece;
if(cur.img)$('imgSize').value=cur.imgSize;
if(cur.despiece)$('despieceSize').value=cur.despieceSize;
document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));const eb=$('errs');
if(shown){const e=validate(d);e.forEach(x=>{const f=$(x[0]);if(f)f.classList.add('bad')});eb.hidden=!e.length;eb.innerHTML=e.length?'<b>Corrige estos datos:</b><ul>'+e.map(x=>'<li data-f="'+x[0]+'">'+esc(x[1])+'</li>').join('')+'</ul>':''}else eb.hidden=true}
let dt;function draft(){clearTimeout(dt);dt=setTimeout(()=>{const o={d:get(),id:cur.id,folio:cur.folio,img:cur.img,despiece:cur.despiece,imgSize:cur.imgSize,despieceSize:cur.despieceSize};if(!ls.set(DR,o)){o.img='';o.despiece='';ls.set(DR,o)}},400)}
const load=()=>{const a=ls.get(K,[]);return Array.isArray(a)?a.filter(r=>r&&typeof r==='object'&&r.id):[]};
function hist(){const a=load();$('hist').innerHTML=a.length?a.map(r=>{const t=num(r.d&&r.d.total);return'<div class="hi"><span><b>'+esc(r.folio)+'</b> · '+esc(r.d&&r.d.cli)+'<br>'+(Number.isInteger(t)?mx(t):'')+'</span><button data-a="open" data-id="'+esc(r.id)+'">Abrir</button><button data-a="dup" data-id="'+esc(r.id)+'">Duplicar</button><button data-a="del" data-id="'+esc(r.id)+'">Borrar</button></div>'}).join(''):'<p class="mu">Aún no hay cotizaciones guardadas.</p>'}
function save(){const a=load(),d=get();
if(!cur.id){let m=0;a.forEach(r=>{const x=/-(\d+)$/.exec(r.folio||'');if(x)m=Math.max(m,+x[1])});cur.id=Date.now()+'-'+Math.random().toString(36).slice(2,6);cur.folio='MM-'+new Date().getFullYear()+'-'+String(m+1).padStart(3,'0')}
const r={id:cur.id,folio:cur.folio,d:d,img:cur.img,despiece:cur.despiece,imgSize:cur.imgSize,despieceSize:cur.despieceSize,ts:Date.now()},i=a.findIndex(x=>x.id===r.id);
if(i>=0)a[i]=r;else a.unshift(r);
let ok=ls.set(K,a),lost=false;if(!ok&&(r.img||r.despiece)){r.img='';r.despiece='';lost=true;ok=ls.set(K,a);if(ok)toast('Guardada sin imágenes: el espacio está lleno.')}

render();hist();draft();return ok&&!lost}

function handleImg(e,field){
const f=e.target.files[0];if(!f)return;
if(!/^image\//.test(f.type)){toast('Elige un archivo de imagen.');e.target.value='';return}
const u=URL.createObjectURL(f),im=new Image();
im.onload=()=>{try{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cur[field]=c.toDataURL('image/jpeg',.82);render();draft()}catch(er){toast('No se pudo procesar la imagen.')}URL.revokeObjectURL(u);e.target.value=''};
im.onerror=()=>{URL.revokeObjectURL(u);toast('No se pudo leer la imagen.');e.target.value=''};im.src=u}

/* ---- Recortador ---- */
const cropCtx={field:null,img:null,sx:0,sy:0,ex:0,ey:0,dragging:false};
function openCrop(field){
  const src=field==='img'?cur.img:cur.despiece;
  if(!src){toast('Primero sube la imagen.');return}
  cropCtx.field=field;cropCtx.dragging=false;
  cropCtx.sx=cropCtx.sy=cropCtx.ex=cropCtx.ey=0;
  $('cropSel').style.display='none';
  const im=$('cropImg');
  im.onload=()=>{cropCtx.img=im};
  im.src=src;
  $('cropDlg').showModal();
}
function clampSel(im,e){
  const r=im.getBoundingClientRect();
  if(!r.width||!r.height)return null;
  const x=Math.max(0,Math.min(r.width,e.clientX-r.left));
  const y=Math.max(0,Math.min(r.height,e.clientY-r.top));
  return {r,x,y};
}
function updateCropSel(){
  const im=$('cropImg');if(!im)return;
  const x=Math.min(cropCtx.sx,cropCtx.ex),y=Math.min(cropCtx.sy,cropCtx.ey);
  const w=Math.abs(cropCtx.ex-cropCtx.sx),h=Math.abs(cropCtx.ey-cropCtx.sy);
  const sel=$('cropSel');
  sel.style.left=x+'px';sel.style.top=y+'px';sel.style.width=w+'px';sel.style.height=h+'px';
}
$('cropWrap').addEventListener('pointerdown',e=>{
  const im=$('cropImg');
  if(!im||e.target!==im)return;
  const c=clampSel(im,e);if(!c)return;
  cropCtx.sx=cropCtx.ex=c.x;cropCtx.sy=cropCtx.ey=c.y;cropCtx.dragging=true;
  try{$('cropWrap').setPointerCapture(e.pointerId)}catch(er){}
  $('cropSel').style.display='block';updateCropSel();e.preventDefault();
});
$('cropWrap').addEventListener('pointermove',e=>{
  if(!cropCtx.dragging)return;
  const im=$('cropImg');if(!im)return;
  const c=clampSel(im,e);if(!c)return;
  cropCtx.ex=c.x;cropCtx.ey=c.y;updateCropSel();
});
$('cropWrap').addEventListener('pointerup',e=>{
  cropCtx.dragging=false;
  try{$('cropWrap').releasePointerCapture(e.pointerId)}catch(er){}
});
$('cropWrap').addEventListener('pointercancel',()=>{cropCtx.dragging=false});
$('cropCancel').onclick=()=>$('cropDlg').close();
$('cropApply').onclick=()=>{
  const im=cropCtx.img||$('cropImg');
  const r=im.getBoundingClientRect();
  const w=Math.abs(cropCtx.ex-cropCtx.sx),h=Math.abs(cropCtx.ey-cropCtx.sy);
  if(w<10||h<10){toast('Arrastra para seleccionar un área más grande.');return}
  const dispW=r.width,dispH=r.height,natW=im.naturalWidth,natH=im.naturalHeight;
  if(!dispW||!dispH||!natW||!natH){toast('La imagen aún no carga.');return}
  const sx=Math.min(cropCtx.sx,cropCtx.ex)/dispW*natW;
  const sy=Math.min(cropCtx.sy,cropCtx.ey)/dispH*natH;
  const sw=w/dispW*natW;
  const sh=h/dispH*natH;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw));
  c.height=Math.max(1,Math.round(sh));
  const cx=c.getContext('2d');
  cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
  cx.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
  cur[cropCtx.field]=c.toDataURL('image/jpeg',.82);
  $('cropDlg').close();
  render();draft();toast('Recorte aplicado.');
};

else if(b.dataset.a==='del'&&confirm('¿Borrar la cotización '+r.folio+'?')){ls.set(K,a.filter(x=>x.id!==r.id));if(cur.id===r.id){cur.id=null;cur.folio=null}hist();render();draft()}};
